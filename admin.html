<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Nova Soft</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>.error-box{color:red; text-align:center; margin-top:10px; font-size:14px;}</style>
</head>
<body>
  <div class="container">
    <div id="loginSection">
      <div class="form-box">
        <h3 id="loginTitle">Admin Login</h3>
        <input type="email" id="adminEmail" placeholder="Email">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="loginAdmin()" id="loginBtn">Ingia</button>
        <div class="error-box" id="errorBox"></div>
      </div>
    </div>

    <div id="adminSection" style="display:none;">
      <header class="topbar">
        <h2 id="dashTitle">Admin <span>Dashboard</span></h2>
        <div>
          <button onclick="changeLang()" class="lang" id="langBtn">🌍 EN</button>
          <button onclick="logout()" class="lang" id="logoutBtn">Toka</button>
        </div>
      </header>
      <div class="form-box">
        <h3 id="addTitle">Ongeza Prompt Mpya</h3>
        <input type="text" id="category" placeholder="Category">
        <input type="text" id="imageLink" placeholder="Link ya Picha">
        <textarea id="prompt" placeholder="Andika Prompt yako kamili..."></textarea>
        <button onclick="savePrompt()" id="saveBtn">Hifadhi Prompt</button>
      </div>
    </div>
  </div>

  <script>
    // CONFIG MPYA
    const firebaseConfig = {
      apiKey: "AIzaSyAUiJdxQ4Z1oQ1t-jSJ7pRU2Rif2I1ZsUU",
      authDomain: "teknova-b248b.firebaseapp.com",
      databaseURL: "https://teknova-b248b-default-rtdb.firebaseio.com",
      projectId: "teknova-b248b",
      storageBucket: "teknova-b248b.firebasestorage.app",
      messagingSenderId: "603617582887",
      appId: "1:603617582887:web:b07ec173acf94767d6d302"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let lang = localStorage.getItem('lang') || 'sw';
    const texts = {
      sw: {loginTitle:"Admin Login", email:"Email", pass:"Neno la Siri", loginBtn:"Ingia", dash:"Admin Dashboard", add:"Ongeza Prompt Mpya", cat:"Category", img:"Link ya Picha", prompt:"Andika Prompt yako kamili...", save:"Hifadhi Prompt", logout:"Toka", lang:"🌍 EN", success:"Imehifadhiwa!"},
      en: {loginTitle:"Admin Login", email:"Email", pass:"Password", loginBtn:"Login", dash:"Admin Dashboard", add:"Add New Prompt", cat:"Category", img:"Image Link", prompt:"Write your full prompt...", save:"Save Prompt", logout:"Logout", lang:"🌍 SW", success:"Saved!"}
    }
    function applyLang(){
      document.getElementById('loginTitle').innerText = texts[lang].loginTitle;
      document.getElementById('adminEmail').placeholder = texts[lang].email;
      document.getElementById('adminPass').placeholder = texts[lang].pass;
      document.getElementById('loginBtn').innerText = texts[lang].loginBtn;
      document.getElementById('dashTitle').innerHTML = texts[lang].dash;
      document.getElementById('addTitle').innerText = texts[lang].add;
      document.getElementById('category').placeholder = texts[lang].cat;
      document.getElementById('imageLink').placeholder = texts[lang].img;
      document.getElementById('prompt').placeholder = texts[lang].prompt;
      document.getElementById('saveBtn').innerText = texts[lang].save;
      document.getElementById('logoutBtn').innerText = texts[lang].logout;
      document.getElementById('langBtn').innerText = texts[lang].lang;
    }
    applyLang();
    function changeLang(){ lang = lang === 'sw'? 'en' : 'sw'; localStorage.setItem('lang', lang); applyLang(); }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'block';
      } else {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminSection').style.display = 'none';
      }
    });

    function loginAdmin(){
      document.getElementById('errorBox').innerText = "";
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      if(!email ||!pass){ document.getElementById('errorBox').innerText = "Jaza Email na Password"; return; }
      auth.signInWithEmailAndPassword(email, pass).catch((error) => {
        document.getElementById('errorBox').innerText = "Error: " + error.code + " - " + error.message;
      });
    }
    function logout(){ auth.signOut(); }
    function savePrompt() {
      const category = document.getElementById('category').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const imageLink = document.getElementById('imageLink').value.trim();
      if(!category ||!prompt) { alert("Jaza Category na Prompt"); return; }
      db.ref('prompts').push({category, prompt, image:imageLink, likes: 25, createdAt: Date.now()}).then(() => {
        alert(texts[lang].success);
        document.getElementById('category').value = "";
        document.getElementById('prompt').value = "";
        document.getElementById('imageLink').value = "";
      });
    }
  </script>
</body>
</html>
