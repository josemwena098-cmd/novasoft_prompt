<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tembea TZ - Gundua Uzuri wa Tanzania</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="logo">Tembea<span>TZ</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tafuta eneo... Andika 'admin' kuingia">
      <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Gundua Uzuri wa Tanzania</h1>
    <p>Serengeti, Zanzibar, Kilimanjaro na zaidi. Anza safari yako sasa.</p>
  </section>

  <!-- MAENEO GRID -->
  <section class="maeneo-section">
    <h2>Vivutio Maarufu</h2>
    <div class="maeneo-grid" id="maeneoGrid">
      <p style="color:#aaa">Inapakia vivutio...</p>
    </div>
  </section>

  <!-- ENEO DETAIL POPUP -->
  <div class="eneo-modal" id="eneoModal">
    <div class="eneo-content">
      <span class="close-btn" onclick="closeEneo()">&times;</span>
      <div id="eneoFullContent"></div>
    </div>
  </div>

  <!-- ADMIN LOGIN + DASHBOARD POPUP -->
  <div class="admin-modal" id="adminModal">
    <div class="admin-box">
      <span class="close-btn" onclick="closeAdmin()">&times;</span>
      <div class="admin-header" id="adminHeader">
        <i class="fa-solid fa-shield-halved"></i>
        <h2>Admin Login</h2>
        <p>Tembea TZ Dashboard</p>
      </div>
      <div class="login-inputs" id="loginInputs">
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Email">
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="pass" placeholder="Password">
        </div>
        <button class="btn-login" id="loginBtn">INGIA →</button>
      </div>
      <div id="dashboard" style="display:none;">
        <h3 style="color:#FCD116; text-align:center; margin-bottom:15px;">Dashboard | Ongeza Vivutio</h3>
        <div class="form-box">
          <input type="text" id="jina" placeholder="Jina la Eneo: mf. Saadani">
          <input type="text" id="mkoa" placeholder="Mkoa: mf. Pwani">
          <select id="aina">
            <option value="Hifadhi">Aina: Hifadhi</option>
            <option value="Pwani">Aina: Pwani</option>
            <option value="Mlima">Aina: Mlima</option>
          </select>
          <div class="template-btns">
            <button type="button" id="tempHifadhi">Template: Hifadhi</button>
            <button type="button" id="tempPwani">Template: Pwani</button>
            <button type="button" id="tempMlima">Template: Mlima</button>
          </div>
          <input type="text" id="picha" placeholder="Link ya Picha">
          <input type="text" id="video" placeholder="Link ya YouTube Video - hiari">
          <textarea id="fupi" placeholder="Maelezo Mafupi"></textarea>
          <textarea id="kamili" placeholder="Maelezo Kamili"></textarea>
          <button class="btn-save" id="saveBtn">HIFADHI ENEO</button>
          <button class="btn-logout" id="logoutBtn">TOKA</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPT NDANI YA HTML ILI ISIBOMOKE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbYznd_wEyJPr_r1mnvUEy651QPhhk4TI",
      authDomain: "teknova-3688d.firebaseapp.com",
      databaseURL: "https://teknova-3688d-default-rtdb.firebaseio.com",
      projectId: "teknova-3688d",
      storageBucket: "teknova-3688d.firebasestorage.app",
      messagingSenderId: "1030215294939",
      appId: "1:1030215294939:web:4d82493402600f4285d1fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    function showDashboard(show){
      document.getElementById('loginInputs').style.display = show? 'none' : 'block';
      document.getElementById('dashboard').style.display = show? 'block' : 'none';
      document.getElementById('adminHeader').style.display = show? 'none' : 'block';
    }

    // SEARCH INAFANYA KAZI HIVI SASA
    document.getElementById('searchBtn').addEventListener('click', handleSearch);
    document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSearch() });

    function handleSearch(){
      const val = document.getElementById('searchInput').value.toLowerCase().trim();
      if(val === 'admin' || val === 'admin login'){
        document.getElementById('adminModal').classList.add('active');
        document.body.style.overflow = 'hidden';
        document.getElementById('searchInput').value = '';
      } else if(val!== ''){
        alert("Umetafuta: " + val);
        document.getElementById('searchInput').value = '';
      }
    }

    // BUTTON ZINGINE ZOTE
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('saveBtn').addEventListener('click', saveEneo);
    document.getElementById('tempHifadhi').addEventListener('click', () => loadTemplate('hifadhi'));
    document.getElementById('tempPwani').addEventListener('click', () => loadTemplate('pwani'));
    document.getElementById('tempMlima').addEventListener('click', () => loadTemplate('mlima'));

    function loadTemplate(type){
      const templates = {
        hifadhi: `**Mahali:** [Andika Mkoa]\n**Shughuli:** Safari\n[Andika maelezo]`,
        pwani: `**Mahali:** [Andika Mkoa]\n**Shughuli:** Kuogelea\n[Andika maelezo]`,
        mlima: `**Mahali:** [Andika Mkoa]\n**Shughuli:** Kupanda\n[Andika maelezo]`
      };
      document.getElementById('kamili').value = templates[type] || "";
    }

    async function login(){
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      if(email === "" || pass === ""){ alert("Jaza email na password"); return; }
      alert("Inaingia...");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        showDashboard(true);
      } catch (error) {
        if(error.code === 'auth/user-not-found'){ alert("User hayupo"); }
        else if(error.code === 'auth/wrong-password'){ alert("Password si sahihi"); }
        else { alert("Error: " + error.message); }
      }
    }

    async function logout(){
      await signOut(auth);
      showDashboard(false);
      document.getElementById('email').value = '';
      document.getElementById('pass').value = '';
    }

    onAuthStateChanged(auth, (user) => { if (user) { showDashboard(true); } else { showDashboard(false); } });

    async function saveEneo(){
      if(!auth.currentUser){ alert("Tafadhali ingia kwanza"); return; }
      const id = document.getElementById('jina').value.toLowerCase().replace(/ /g, "-");
      await set(ref(db, 'maeneo/' + id), {
        jina: document.getElementById('jina').value, mkoa: document.getElementById('mkoa').value, aina: document.getElementById('aina').value,
        pichaKuu: document.getElementById('picha').value, video: document.getElementById('video').value,
        maelezoFupi: document.getElementById('fupi').value, maelezoKamili: document.getElementById('kamili').value, active: true
      });
      alert("✓ Imehifadhiwa!");
      document.querySelectorAll('.form-box input,.form-box textarea').forEach(i => i.value = '');
    }

    async function loadMaeneo() {
      const snapshot = await get(child(ref(db), `maeneo`));
      const maeneoGrid = document.getElementById('maeneoGrid');
      maeneoGrid.innerHTML = "";
      if(snapshot.exists()){
        snapshot.forEach((childSnapshot) => {
          const eneo = childSnapshot.val(); const id = childSnapshot.key;
          if(eneo.active){ maeneoGrid.innerHTML += `<div class="eneo-card" onclick="openEneo('${id}')"><img src="${eneo.pichaKuu}" class="eneo-img"><div class="eneo-tag">${eneo.aina}</div><h3>${eneo.jina}</h3><p class="eneo-excerpt">${eneo.maelezoFupi}</p><p class="eneo-mkoa"><i class="fa-solid fa-location-dot"></i> ${eneo.mkoa}</p></div>`; }
        });
      }
    }
    loadMaeneo();

    window.openEneo = async function(id) {
      const snapshot = await get(child(ref(db), `maeneo/${id}`));
      if(snapshot.exists()){
        const eneo = snapshot.val();
        document.getElementById('eneoFullContent').innerHTML = `${eneo.video? `<iframe src="${eneo.video}" class="video-frame" allowfullscreen></iframe>` : `<img src="${eneo.pichaKuu}" class="blog-full-img">`}<div class="blog-full-body"><div class="blog-tag">${eneo.aina}</div><h1>${eneo.jina}</h1><p class="eneo-mkoa"><i class="fa-solid fa-location-dot"></i> ${eneo.mkoa}</p><p style="white-space: pre-line">${eneo.maelezoKamili}</p></div>`;
        document.getElementById('eneoModal').classList.add('active'); document.body.style.overflow = 'hidden';
      }
    }

    window.closeEneo = function(){ document.getElementById('eneoModal').classList.remove('active'); document.body.style.overflow = 'auto'; }
    window.closeAdmin = function(){ document.getElementById('adminModal').classList.remove('active'); document.body.style.overflow = 'auto'; }

  </script>
</body>
</html>
