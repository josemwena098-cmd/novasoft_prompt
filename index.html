<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tembea TZ - Gundua Uzuri wa Tanzania</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="logo">Tembea<span>TZ</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tafuta eneo... Andika 'admin' kuingia">
      <button onclick="handleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Gundua Uzuri wa Tanzania</h1>
    <p>Serengeti, Zanzibar, Kilimanjaro na zaidi. Anza safari yako sasa.</p>
  </section>

  <!-- MAENEO GRID -->
  <section class="maeneo-section">
    <h2>Vivutio Maarufu</h2>
    <div class="maeneo-grid" id="maeneoGrid">
      <p style="color:#aaa">Inapakia vivutio...</p>
    </div>
  </section>

  <!-- ENEO DETAIL POPUP -->
  <div class="eneo-modal" id="eneoModal">
    <div class="eneo-content">
      <span class="close-btn" onclick="closeEneo()">&times;</span>
      <div id="eneoFullContent"></div>
    </div>
  </div>

  <!-- ADMIN LOGIN + DASHBOARD POPUP -->
  <div class="admin-modal" id="adminModal">
    <div class="admin-box">
      <span class="close-btn" onclick="closeAdmin()">&times;</span>
      
      <!-- HEADER ITAFICHIKA BAADA YA LOGIN -->
      <div class="admin-header">
        <i class="fa-solid fa-shield-halved"></i>
        <h2>Admin Login</h2>
        <p>Tembea TZ Dashboard</p>
      </div>

      <!-- SEHEMU YA LOGIN - ITAFICHIKA BAADA YA LOGIN -->
      <div class="login-inputs" id="loginInputs">
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="Email">
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="pass" placeholder="Password">
        </div>
        <button class="btn-login" onclick="login()">INGIA →</button>
      </div>

      <!-- SEHEMU YA DASHBOARD - ITAONEKANA BAADA YA LOGIN -->
      <div id="dashboard" style="display:none;">
        <h3 style="color:#FCD116; text-align:center; margin-bottom:15px;">Dashboard | Ongeza Vivutio</h3>
        <div class="form-box">
          <input type="text" id="jina" placeholder="Jina la Eneo: mf. Saadani">
          <input type="text" id="mkoa" placeholder="Mkoa: mf. Pwani">
          <select id="aina">
            <option value="Hifadhi">Aina: Hifadhi</option>
            <option value="Pwani">Aina: Pwani</option>
            <option value="Mlima">Aina: Mlima</option>
          </select>

          <div class="template-btns">
            <button type="button" onclick="loadTemplate('hifadhi')">Template: Hifadhi</button>
            <button type="button" onclick="loadTemplate('pwani')">Template: Pwani</button>
            <button type="button" onclick="loadTemplate('mlima')">Template: Mlima</button>
          </div>

          <input type="text" id="picha" placeholder="Link ya Picha">
          <input type="text" id="video" placeholder="Link ya YouTube Video - hiari">
          <textarea id="fupi" placeholder="Maelezo Mafupi"></textarea>
          <textarea id="kamili" placeholder="Maelezo Kamili"></textarea>
          <button class="btn-save" onclick="saveEneo()">HIFADHI ENEO</button>
          <button class="btn-logout" onclick="logout()">TOKA</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPT -->
  <script type="module" src="script.js"></script>
</body>
</html>
