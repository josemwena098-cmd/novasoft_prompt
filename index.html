<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Soft - Prompt Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="container">
    
    <header class="topbar">
      <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Nova Logo">
        <div class="logo-text">
          <h4>NOVA SOFT</h4>
          <h2>PROMPT <span id="libText">LIBRARY</span></h2>
        </div>
      </div>
      <button class="lang" id="langBtn" onclick="changeLang()">🌍 EN</button>
    </header>

    <!-- BUTTONS ZA CATEGORY JUU -->
    <div class="category-bar" id="categoryBar">
      <button class="cat-btn active" onclick="filterCategory('all')">All</button>
    </div>

    <div class="grid" id="promptsList">
      <p style="text-align:center; color:#999;">Inapakia...</p>
    </div>

    <!-- HAPA NDIPO BANNER ITAONEKANA -->
    <div id="bannerAd" style="text-align:center; margin:20px 0;"></div>

    <footer>
      <div class="social-buttons">
        <a href="https://wa.me/255611378027" target="_blank" class="social-btn wa-btn">WhatsApp</a>
        <a href="https://www.facebook.com/profile.php?id=61592226807555" target="_blank" class="social-btn fb-btn">Facebook</a>
      </div>
      <p id="footerText">© 2026 Nova Soft. All Rights Reserved. Powered by AI</p>
    </footer>

  </div>

  <script src="script.js"></script>

  <!-- MONETAG IN-PAGE PUSH -->
  <script src='//5gvci.com/11519259.js'></script>

  <!-- REGISTER MONETAG SERVICE WORKER -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Monetag SW Registered'))
        .catch(err => console.log('SW Error:', err));
    });
  }
  </script>
</body>
</html>
